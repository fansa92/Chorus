name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: "true"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: "1"

jobs:
  test:
    name: 单元测试
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 缓存 NuGet 依赖包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 还原依赖
        run: dotnet restore tests/Chorus.Core.Tests/Chorus.Core.Tests.csproj

      - name: 运行单元测试
        run: dotnet test tests/Chorus.Core.Tests/Chorus.Core.Tests.csproj -c Release --no-restore

  build:
    name: 编译 WinUI 应用
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: 缓存 NuGet 依赖包
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: 还原依赖（含 win-x64 运行时）
        run: dotnet restore src/Chorus.App/Chorus.App.csproj -r win-x64

      - name: 发布应用 (win-x64)
        run: dotnet publish src/Chorus.App/Chorus.App.csproj -c Release -r win-x64 --self-contained true -p:Platform=x64 --no-restore -o publish

      - name: 下载 sing-box 核心进包
        shell: pwsh
        run: |
          $rel = Invoke-RestMethod "https://api.github.com/repos/SagerNet/sing-box/releases/latest"
          $asset = $rel.assets | Where-Object { $_.name -match 'windows-amd64\.zip$' } | Select-Object -First 1
          if (-not $asset) { throw "未找到 sing-box windows-amd64 资产" }
          Invoke-WebRequest $asset.browser_download_url -OutFile sb.zip
          Expand-Archive sb.zip -DestinationPath sb
          New-Item -ItemType Directory -Force -Path publish/core | Out-Null
          Copy-Item sb/*/sing-box.exe publish/core/
          Write-Output "已打包核心: $($asset.name)"

      - name: 校验发布包不含 bin/obj 中间产物
        shell: pwsh
        run: |
          $junk = Get-ChildItem publish -Recurse -Directory | Where-Object { $_.Name -in @('bin', 'obj') }
          if ($junk) { throw "发布包里出现了编译/测试中间产物：`n$($junk.FullName -join "`n")" }
          Write-Output "发布包校验通过：无 bin/obj 中间产物"

      - name: 打包 zip
        shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath Chorus-win-x64.zip -Force

      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: Chorus-win-x64
          path: Chorus-win-x64.zip
